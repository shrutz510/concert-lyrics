name: Release

# Push a version tag to publish a release, e.g.
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  release:
    name: Publish GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml version $version"
            exit 1
          fi

      - name: Package the app
        run: |
          name="concert-lyrics-$GITHUB_REF_NAME"
          mkdir -p "dist/$name"
          cp -r app.py templates README.md GUIDE.md .env.example "dist/$name/"
          (cd dist && zip -qr "$name.zip" "$name")
          ls -l dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/concert-lyrics-$GITHUB_REF_NAME.zip" --generate-notes --verify-tag
