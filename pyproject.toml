[project]
name = "concert-lyrics"
version = "1.0.0"
description = "Lyrics to every song in an artist's latest setlist, on one page for the concert"
requires-python = ">=3.9"

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# pycodestyle, pyflakes, import order, bugbear, and pyupgrade checks
select = ["E", "W", "F", "I", "B", "UP"]
